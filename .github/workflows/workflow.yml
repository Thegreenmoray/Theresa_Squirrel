name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Service containers for database integration testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRESUSER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRESPASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRESDB }}
        ports:
          - 5432:5432
        # Health check to ensure Postgres is fully up before running steps
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Run Prisma Migrations
        working-directory: server
        env:
          DATABASE_URL: "postgresql://${{ secrets.POSTGRESUSER }}:${{ secrets.POSTGRESPASSWORD }}@localhost:5432/${{ secrets.POSTGRESDB }}?schema=public"
        run: npx prisma migrate deploy

      - name: Build TypeScript Project
        working-directory: server
        run: npm run build